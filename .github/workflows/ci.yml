name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  autotools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools + shellcheck
        run: sudo apt-get update && sudo apt-get install -y autoconf automake shellcheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python3 -m pip install -r server/requirements.txt

      - name: Build and check
        run: |
          ./autogen.sh
          ./configure
          make
          make check

  desktop-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the .mcpb bundle
        run: ./desktop-extension/build.sh

  docker-compose-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config
