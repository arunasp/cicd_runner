name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  autotools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install autotools + shellcheck
        run: sudo apt-get update && sudo apt-get install -y autoconf automake shellcheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: python3 -m pip install -r server/requirements.txt

      - name: Build and check
        run: |
          ./autogen.sh
          ./configure
          make
          make check

  desktop-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the .mcpb bundle
        run: ./desktop-extension/build.sh

      # Uploaded so tag-release can attach it to the GitHub Release
      # without rebuilding -- artifacts don't cross jobs by default.
      - name: Upload .mcpb artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-extension-mcpb
          path: desktop-extension/dist/*.mcpb

  docker-compose-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config

  # Tags and releases automatically on a version bump to
  # configure.ac's own AC_INIT -- the same single source of truth
  # `make dist`/`make install` already use, not a separate
  # release-specific version file. Deliberately only runs on a real
  # push to main (never on a PR, and never before the other three
  # jobs above have already passed via `needs:` -- a broken build is
  # never tagged or released). Bump the version by editing
  # configure.ac's own AC_INIT line and pushing to main; nothing else
  # to remember or run by hand.
  #
  # Standard, established pattern (tag-on-version-bump), not an
  # invented one -- matches this project's own "Makefile as CI/CD
  # manifest" philosophy of following FOSS convention rather than a
  # bespoke mechanism. softprops/action-gh-release is the de facto
  # standard action for this exact step across the GitHub Actions
  # ecosystem.
  tag-release:
    needs: [autotools, desktop-extension, docker-compose-syntax]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history -- need every existing tag to check against

      - name: Extract version from configure.ac
        id: version
        run: |
          version=$(grep -oP "AC_INIT\(\[cicd-runner\], \[\K[^]]+" configure.ac)
          if [ -z "$version" ]; then
            echo "Could not extract version from configure.ac's AC_INIT line" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check whether this version is already tagged
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Added 2026-08-09, after a real incident: a v1.0.0 tag had been
      # created locally (git tag) but never pushed, so the check above
      # correctly saw no existing remote tag and this job correctly
      # created a release -- but AC_INIT's own version had also never
      # been bumped since that local tag was made, so the resulting
      # release ended up labeled v1.0.0 against a much later commit
      # than what that version number had originally meant. This step
      # doesn't (and structurally can't) catch THAT specific case --
      # CI has no visibility into a tag that was never pushed -- but it
      # closes the more common, ongoing risk: forgetting to bump
      # AC_INIT on a LATER push, after tags are already properly
      # synced with the remote. Compares via `sort -V` (real version
      # ordering, not plain string comparison -- confirmed 1.9.0 <
      # 1.10.0 sorts correctly, unlike a naive string compare) against
      # the latest existing tag; fails loudly rather than silently
      # creating a release for a stale or backwards version number. No
      # existing tags at all (a genuine first release) is not an error.
      - name: Verify the version is newer than the latest existing tag
        if: steps.check.outputs.exists == 'false'
        run: |
          current_version="${{ steps.version.outputs.version }}"
          latest_tag=$(git tag --list 'v*' | sort -V | tail -1)
          if [ -z "$latest_tag" ]; then
            echo "No existing tags -- first release, proceeding."
            exit 0
          fi
          latest_version="${latest_tag#v}"
          if [ "$latest_version" = "$current_version" ]; then
            echo "ERROR: configure.ac's AC_INIT version ($current_version) equals the latest existing tag ($latest_tag) -- bump AC_INIT before pushing." >&2
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$latest_version" "$current_version" | sort -V | tail -1)
          if [ "$highest" != "$current_version" ]; then
            echo "ERROR: configure.ac's AC_INIT version ($current_version) is not newer than the latest existing tag ($latest_tag) -- bump AC_INIT before pushing." >&2
            exit 1
          fi
          echo "Version $current_version is newer than latest tag $latest_tag -- OK."

      - name: Build the dist tarball
        if: steps.check.outputs.exists == 'false'
        run: |
          sudo apt-get update && sudo apt-get install -y autoconf automake
          python3 -m pip install -r server/requirements.txt
          ./autogen.sh
          ./configure
          make dist

      - name: Download the .mcpb artifact
        if: steps.check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: desktop-extension-mcpb
          path: desktop-extension/dist/

      - name: Tag and create the release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            cicd-runner-${{ steps.version.outputs.version }}.tar.gz
            desktop-extension/dist/*.mcpb
