[pytest]
# Any warning fails the suite, except ones explicitly listed below with a
# reason. Without this, a permanent third-party warning makes "1 warning"
# the normal result, and a NEW warning -- including a real deprecation in
# our own code -- blends into that noise unnoticed.
filterwarnings =
    error
    # pydantic-settings >= 2.15 warns that FastMCP's own Settings.lifespan
    # field has an unresolved forward reference: it is annotated with a
    # generic type defined LATER in that same module, so pydantic cannot
    # resolve it at class-creation time. Upstream in the MCP SDK, raised
    # when FastMCP() is constructed rather than on import.
    #
    # Not fixable here, and not worth chasing: pydantic-settings arrives as
    # an unpinned transitive dependency of mcp, and the SDK release that
    # drops pydantic-settings (2.0.0) also removes the mcp.server.fastmcp
    # import path entirely, so "upgrade" means a rewrite. Ignored by exact
    # class rather than by message, so a different pydantic-settings
    # warning still fails.
    ignore::pydantic_settings.exceptions.IncompleteFieldDefinitionWarning
